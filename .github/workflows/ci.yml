name: CI — Test, Lint, Security

on:
  push:
    branches:
      - main
      - develop
      - codex/project-factory-policy-governance
  pull_request:
    branches:
      - main
      - develop
      - codex/project-factory-policy-governance
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Code Quality — Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install "ruff>=0.4.0"

      - name: Lint
        run: |
          set +e
          ruff check . --output-format=github | tee ruff-check.log
          status=${PIPESTATUS[0]}
          ruff check . --output-format=json > ruff-check.json || true
          set -e
          exit $status

      - name: Format check
        run: |
          set +e
          ruff format --check . | tee ruff-format.log
          status=${PIPESTATUS[0]}
          set -e
          exit $status

      - name: Upload Ruff reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruff-reports
          path: |
            ruff-check.log
            ruff-check.json
            ruff-format.log

  security:
    name: Security — Bandit and pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install "bandit[toml]>=1.7.8" "pip-audit>=2.7.3"

      - name: Bandit static scan
        run: |
          set +e
          bandit -r apps libs services core infra scripts \
            -x tests,alembic,libs/vendor,.legacy_archive \
            -ll \
            --format json \
            -o bandit-report.json
          status=$?
          set -e
          if [ -f bandit-report.json ]; then
            cat bandit-report.json
          fi
          exit $status

      - name: pip-audit dependency scan
        run: |
          set +e
          pip-audit -r requirements.txt --format json --output pip-audit-report.json
          status=$?
          set -e
          if [ -f pip-audit-report.json ]; then
            cat pip-audit-report.json
          fi
          exit $status

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  test:
    name: Backend Test Suite — pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_company_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_company_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-min64chars-padding-padding-padding-padding-padding
      ADMIN_SECRET: ci-admin-secret
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock pytest-cov

      - name: Backend import smoke test
        run: |
          python -c "import apps.public_api.main; print('apps.public_api.main import ok')"
          python -c "import services.workflow_api.main; print('services.workflow_api.main import ok')"

      - name: Backend production import smoke test
        env:
          APP_ENV: production
          ENVIRONMENT: production
          ANTHROPIC_API_KEY: ci-anthropic-key
          WEBHOOK_SECRET: ci-webhook-secret-strong
        run: |
          python -c "import apps.public_api.main; print('apps.public_api.main production import ok')"
          python -c "import services.workflow_api.main; print('services.workflow_api.main production import ok')"

      - name: Run tests
        run: |
          set +e
          pytest tests/ -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=pytest-report.xml \
            --tb=short 2>&1 | tee pytest-output.log
          status=${PIPESTATUS[0]}
          set -e
          exit $status

      - name: Upload pytest reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-reports
          path: |
            pytest-output.log
            pytest-report.xml
            coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  ui-test:
    name: UI E2E — Playwright
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-playwright

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run UI tests
        run: pytest tests/e2e/ -v

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace apps/refine_control_plane

      - name: Build frontend
        run: npm run build --workspace apps/refine_control_plane

  docker:
    name: Docker Build Gate
    runs-on: ubuntu-latest
    needs: [lint, security, test, ui-test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production-slim
          push: false
          tags: otomatikajan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
