name: Autonomous Instagram Cloud Growth Publisher (@ai_gucum_)

on:
  schedule:
    # 12:30 TSI (09:30 UTC)
    - cron: '30 9 * * *'
    # 20:30 TSI (17:30 UTC)
    - cron: '30 17 * * *'
  workflow_dispatch:

jobs:
  publish_and_audit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytest

      - name: 🌐 Install Playwright Browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: 🚀 Run 30-Day Strategy Publisher
        env:
          META_GRAPH_ACCESS_TOKEN: ${{ secrets.META_GRAPH_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          python -m workspace.carousel_engine.thirty_day_scheduler
          python -m workspace.carousel_engine.inspect_and_publish_selected

      - name: 💾 Commit and Push Updated Strategy Calendar & Logs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Publisher"
          git add artifacts/carousels/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update 30-day instagram publication logs [skip ci]" && git push)
