[build-system]
requires      = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "bilgeapi"
version     = "1.3.0"
description = "Sovereign AGI — BilgeAPI Autonomous Platform Core"
requires-python = ">=3.12"
readme      = "README.md"
license     = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.26",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic[email]>=2.6.0",
    "sqlalchemy[asyncio]==2.0.29",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "aiosqlite==0.20.0",
    "bcrypt>=4.1.2",
    "pyjwt>=2.8.0",
    "celery[redis]==5.3.6",
    "redis==5.0.3",
    "python-dotenv==1.2.2",
    "prometheus-client>=0.20.0",
    "python-telegram-bot==21.10",
    "google-generativeai==0.8.0",
    "PyGithub==2.3.0",
    "aiofiles==23.2.1",
]

[tool.setuptools]
packages = [
    "bilgeapi",
    "bilgeapi.adapters",
    "bilgeapi.agents",
    "bilgeapi.core",
    "bilgeapi.execution",
    "bilgeapi.governance",
    "bilgeapi.integrations",
    "bilgeapi.llm",
    "bilgeapi.locales",
    "bilgeapi.memory",
    "bilgeapi.models",
    "bilgeapi.orchestration",
    "bilgeapi.repositories",
    "bilgeapi.routers",
    "bilgeapi.schemas",
    "bilgeapi.security",
    "bilgeapi.services",
    "bilgeapi.libs",
    "bilgeapi.libs.db",
    "bilgeapi.libs.queue_abstractions",
    "bilgeapi.libs.observability"
]
