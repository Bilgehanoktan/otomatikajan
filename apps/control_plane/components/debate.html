<div id="page-debate" class="page">
  <div class="card" style="margin-bottom:24px;">
    <div class="card-header"><span class="card-title">⚖️ Canlı Münazara Sahnesi</span></div>
    <div id="debate-stage" style="min-height:300px; display:flex; justify-content:space-around; align-items:center; padding:40px; background:radial-gradient(circle at center, rgba(0,212,245,0.05) 0%, transparent 70%); position:relative; overflow:hidden;">
      <div id="debate-idle-overlay" style="position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; background:rgba(10,15,24,0.8); z-index:10; color:var(--muted); font-size:14px; backdrop-filter:blur(4px);">
        Münazara başlatılması bekleniyor...
      </div>
      <!-- Agent A Slot -->
      <div id="slot-agent-a" class="debate-slot">
        <div class="agent-avatar" id="avatar-a">🏛️</div>
        <div class="agent-label" id="label-a">Agent A</div>
        <div class="typing-indicator" id="typing-a" style="display:none;"><span></span><span></span><span></span></div>
      </div>
      
      <!-- VS / VS Indicator -->
      <div style="font-size:24px; font-weight:800; color:rgba(255,255,255,0.1); font-family:var(--outfit);">VS</div>

      <!-- Agent B Slot -->
      <div id="slot-agent-b" class="debate-slot">
        <div class="agent-avatar" id="avatar-b">🧠</div>
        <div class="agent-label" id="label-b">Agent B</div>
        <div class="typing-indicator" id="typing-b" style="display:none;"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-header"><span class="card-title">⚖️ Yapılandırma</span></div>
      <div style="padding:20px;">
        <div class="form-row"><label>Münazara Başlığı</label><input id="db-topic" placeholder="Sistem mimarisi karşılaştırması..."></div>
        <div class="form-row"><label>Bağlam / Teknik Detaylar</label><textarea id="db-context" rows="3" placeholder="Teknik detaylar ve kısıtlamalar..."></textarea></div>
        <div class="grid-2" style="gap:12px; margin-bottom:12px;">
          <div class="form-row">
            <label>🏛️ Ajan A (Savunucu)</label>
            <select id="db-agent-a">
              <option value="backend_dev">⚙️ Backend Geliştirici</option>
              <option value="frontend_dev">🎨 Frontend Geliştirici</option>
              <option value="architect">🏛️ Sistem Mimarı</option>
              <option value="qa_engineer">🧪 QA Mühendisi</option>
              <option value="devops">🚀 DevOps Mühendisi</option>
              <option value="security" selected>🔒 Güvenlik Uzmanı</option>
              <option value="data_eng">🗄️ Veri Mühendisi</option>
              <option value="tech_writer">📝 Teknik Yazar</option>
            </select>
          </div>
          <div class="form-row">
            <label>🧠 Ajan B (Muhalif)</label>
            <select id="db-agent-b">
              <option value="backend_dev" selected>⚙️ Backend Geliştirici</option>
              <option value="frontend_dev">🎨 Frontend Geliştirici</option>
              <option value="architect">🏛️ Sistem Mimarı</option>
              <option value="qa_engineer">🧪 QA Mühendisi</option>
              <option value="devops">🚀 DevOps Mühendisi</option>
              <option value="security">🔒 Güvenlik Uzmanı</option>
              <option value="data_eng">🗄️ Veri Mühendisi</option>
              <option value="tech_writer">📝 Teknik Yazar</option>
            </select>
          </div>
        </div>
        <div class="form-row" style="margin-bottom:16px;">
          <label>⚖️ Moderatör</label>
          <select id="db-moderator">
            <option value="architect" selected>🏛️ Sistem Mimarı</option>
            <option value="backend_dev">⚙️ Backend Geliştirici</option>
            <option value="qa_engineer">🧪 QA Mühendisi</option>
            <option value="devops">🚀 DevOps Mühendisi</option>
            <option value="security">🔒 Güvenlik Uzmanı</option>
          </select>
        </div>
        <button id="db-start-btn" class="btn btn-primary" style="width:100%;" onclick="startDebate()">▶ Münazarayı Başlat</button>
      </div>
    </div>
    <div class="card" style="display:flex; flex-direction:column;">
       <div class="card-header"><span class="card-title">🎭 Canlı Akış & Konsensüs</span></div>
       <div id="debate-live-feed" style="flex:1; padding:16px; font-size:12px; font-family:var(--mono); max-height:280px; overflow-y:auto; color:var(--text2);">
         <div style="color:var(--muted); text-align:center; margin-top:40px;">Henüz bir argüman yok.</div>
       </div>
       <div id="debate-consensus-card" style="padding:16px; border-top:1px solid var(--border); background:rgba(34,197,94,0.05); display:none;">
         <div style="font-size:10px; font-weight:700; color:var(--green); margin-bottom:8px;">KONSENSÜS RAPORU</div>
         <div id="debate-consensus" style="font-size:12px; line-height:1.5;"></div>
       </div>
    </div>
  </div>
</div>
