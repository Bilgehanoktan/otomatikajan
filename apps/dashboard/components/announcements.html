<div class="card announcements">
    <div class="card-header">
        <span class="card-title"><i class="fas fa-bullhorn"></i> Duyurular</span>
    </div>
    <div id="announcement-list" class="announcement-body">
        <div class="loading">Duyurular yükleniyor...</div>
    </div>
</div>

<style>
    .announcements { height: 100%; }
    .announcement-body { padding: 10px; }
    .announcement-item {
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
    }
    .announcement-item:last-child { border-bottom: none; }
    .announcement-tag {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        text-transform: uppercase;
        margin-right: 8px;
    }
    .tag-info { background: rgba(52, 152, 219, 0.1); color: var(--accent); border: 1px solid rgba(52, 152, 219, 0.2); }
    .tag-warning { background: rgba(241, 196, 15, 0.1); color: var(--yellow); border: 1px solid rgba(241, 196, 15, 0.2); }
    .tag-critical { background: rgba(231, 76, 60, 0.1); color: var(--red); border: 1px solid rgba(231, 76, 60, 0.2); }
    
    .announcement-title { font-weight: 600; color: var(--text); margin-bottom: 4px; display: block; }
    .announcement-date { font-size: 11px; color: var(--muted); }
    .announcement-content { font-size: 13px; color: var(--text2); margin-top: 5px; line-height: 1.4; }
</style>

<script>
    (function() {
        const Announcements = {
            async init() {
                try {
                    const response = await fetch('http://localhost:3100/api/announcements?sort=-publishedDate&limit=5');
                    const data = await response.json();
                    this.render(data.docs || []);
                } catch (e) {
                    console.error("[Announcements] Fetch error:", e);
                    document.getElementById('announcement-list').innerHTML = `<div class="error" style="color:var(--red); font-size:12px;">CMS bağlantısı hatası.</div>`;
                }
            },
            
            render(list) {
                const container = document.getElementById('announcement-list');
                if (list.length === 0) {
                    container.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:12px; padding:20px;">Aktif duyuru bulunmuyor.</div>`;
                    return;
                }
                
                container.innerHTML = list.map(a => `
                    <div class="announcement-item">
                        <div style="display:flex; align-items:center;">
                            <span class="announcement-tag tag-${a.type || 'info'}">${a.type || 'duyuru'}</span>
                            <span class="announcement-date">${new Date(a.publishedDate).toLocaleDateString('tr-TR')}</span>
                        </div>
                        <a href="#" class="announcement-title">${a.title}</a>
                        <div class="announcement-content">${a.content.length > 100 ? a.content.substring(0, 100) + '...' : a.content}</div>
                    </div>
                `).join('');
            }
        };
        
        Announcements.init();
    })();
</script>
