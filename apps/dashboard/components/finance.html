<div id="page-finance" class="page content-container" style="display:none;">
    <h2 class="page-title">Finansal İstihbarat & Bütçe Yönetimi</h2>
    <div class="stats-grid">
        <div class="stat-card cyan">
            <div class="stat-label">Toplam Bütçe</div>
            <div id="fin-total-budget" class="stat-value">$1,000,000</div>
        </div>
        <div class="stat-card red">
            <div class="stat-label">Harcanan</div>
            <div id="fin-spent" class="stat-value">$0</div>
        </div>
        <div class="stat-card green">
            <div class="stat-label">Kalan</div>
            <div id="fin-remaining" class="stat-value">$1,000,000</div>
        </div>
        <div class="stat-card purple">
            <div class="stat-label">Yıkım Oranı (Burn Rate)</div>
            <div id="fin-burn" class="stat-value">$0 / gün</div>
        </div>
    </div>

    <div class="card-grid">
        <div class="card">
            <div class="card-header"><span class="card-title">İşlem Geçmişi</span></div>
            <div id="finance-history" class="log-container">
                <div class="loading">Finansal veriler getirilıyor...</div>
            </div>
        </div>
        <div class="card">
            <div class="card-header"><span class="card-title">Gider Analizi</span></div>
            <div id="finance-analysis" style="padding:15px; text-align:center; color:var(--muted);">
                Gider analizi motoru başlatılıyor...
            </div>
        </div>
    </div>
</div>
