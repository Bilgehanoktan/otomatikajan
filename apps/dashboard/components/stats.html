<div class="stats-grid">
  <div class="stat-card cyan">
    <div class="stat-label">Toplam Harekat</div>
    <div id="s-total" class="stat-value">—</div>
    <div class="stat-detail">Kümülatif Görev Sayısı</div>
  </div>

  <!-- Phase 54: Metabolic Metabolism -->
  <div class="stat-card premium-accent">
    <div class="stat-label">Metabolik İşleme</div>
    <div id="stat-metabolic-mode" class="stat-value" style="font-size:16px; color:var(--accent);">NORMAL</div>
    <div class="progress-bar-mini" style="margin-top:8px;">
        <div id="stat-metabolic-score-fill" class="progress-fill" style="width:100%; height:3px; background:var(--accent);"></div>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:4px; font-size:9px; color:var(--muted);">
        <span>SYNC_RATE</span>
        <span id="stat-metabolic-score">1.0</span>
    </div>
  </div>

  <!-- Phase 41: Governance -->
  <div class="stat-card">
    <div class="stat-label">Öz-Yönetişim Sağlığı</div>
    <div class="stat-value" id="gov-health-value">100%</div>
    <div class="stat-trend" id="gov-status-label" style="color:var(--safe);">KURAL UYUMLU</div>
  </div>

  <!-- Phase 12.1: Integrity Shield -->
  <div class="stat-card gold-border">
    <div class="stat-label">Bütünlük Kalkanı</div>
    <div id="integrity-shield-status" class="stat-value" style="font-size:16px;">SECURE</div>
    <div style="font-size:9px; color:var(--muted); margin-top:4px;">GÜVEN SKORU: <span id="integrity-score" style="color:var(--gold); font-weight:700;">100%</span></div>
  </div>

  <div class="stat-card orange"><div class="stat-label">Çalışan</div><div id="s-running" class="stat-value">—</div></div>
  <div class="stat-card green"><div class="stat-label">Başarı</div><div id="s-completed" class="stat-value">—</div></div>
  <div class="stat-card purple"><div class="stat-label">Maliyet</div><div id="s-cost" class="stat-value">—</div></div>
  
  <div class="stat-card red">
    <div class="stat-label">Hata</div>
    <div id="s-error" class="stat-value">—</div>
    <div id="stat-cognitive-load" style="font-size:9px; color:var(--muted); margin-top:4px;">BİLİŞSEL YÜK: —</div>
  </div>
</div>
