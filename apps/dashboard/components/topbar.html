<header class="topbar">
  <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Bilişsel izleklerde ara..." id="global-search">
  </div>
  <div class="topbar-actions">
      <!-- Metabolik Gösterge -->
      <div class="metabolic-status" title="Metabolik Pacing Durumu">
          <span id="pacing-label" class="badge badge-normal">METABOLIC: STABLE</span>
      </div>
      
      <!-- Bildirimler -->
      <div class="action-btn" id="notification-trigger">
          <i class="fas fa-bell"></i>
          <span class="notification-badge" id="notif-count">0</span>
      </div>

      <div class="divider"></div>

      <div class="profile-section">
          <div style="text-align:right;">
              <div style="font-size:12px; font-weight:700; color:#fff;">MASTER COMMAND</div>
              <div style="font-size:10px; color:var(--accent);">Faz 12.1 Root</div>
          </div>
          <div class="profile-avatar">
              <i class="fas fa-user-shield"></i>
          </div>
      </div>
  </div>
</header>
