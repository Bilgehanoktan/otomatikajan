<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sovereign AGI | Faz 12.1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/sovereign_v121.css">
  <link rel="stylesheet" href="/static/css/style_v2.css">
  <style>
    #app-loader {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #0a0f18; display: flex; flex-direction: column;
        align-items: center; justify-content: center; z-index: 9999;
        transition: opacity 0.5s ease;
    }
    .loader-orb {
        width: 60px; height: 60px; border-radius: 50%;
        background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
        box-shadow: 0 0 30px var(--accent-glow);
        animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.5; } }
  </style>
</head>
<body>
  <!-- App Loading Overlay -->
  <div id="app-loader">
    <div class="loader-orb"></div>
    <div style="margin-top: 20px; color: var(--accent); font-family: var(--mono); font-size: 12px; letter-spacing: 2px;">
      SOVEREIGN CORE INITIALIZING...
    </div>
  </div>

  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="app">
    <!-- Component: Sidebar -->
    <div id="comp-sidebar"></div>

    <div class="main">
      <!-- Alerts -->
      <div id="memory-leak-alert" class="alert-bar" style="display:none; background:var(--red); color:#fff;">
        ⚠️ KRİTİK BELLEK SIZINTISI TESPİT EDİLDİ! ⚠️
      </div>
      
      <!-- Component: Topbar -->
      <div id="comp-topbar"></div>

      <div id="content" class="content">
        <!-- Dashboard Components -->
        <div id="page-dashboard" class="page active">
            <div id="comp-stats"></div>
            <div class="grid-2">
                <div class="card">
                    <div class="card-header"><span class="card-title">Son Görevler</span><button class="btn btn-ghost btn-sm" onclick="showPage('tasks')">Tümünü Gör</button></div>
                    <div id="recent-tasks"></div>
                </div>
                <!-- Other static cards kept here for now or can be componentized further -->
                <div id="comp-agi-mood"></div>
                <div id="comp-evolution"></div>
                <div id="comp-announcements"></div>
            </div>
        </div>

        <!-- Component-based Pages -->
        <div id="page-finance-root"></div>
        <div id="page-tasks-root"></div>
        <div id="page-approvals-root"></div>
        <div id="page-repair-root"></div>
        <div id="page-improvement-root"></div>
        <div id="page-logs-root"></div>
        <div id="page-ceo-root"></div>
        <div id="page-monitoring-root"></div>
        <div id="page-knowledge-root"></div>
        <div id="page-runbooks-root"></div>
        <div id="page-debate-root"></div>
        <div id="page-codegen-root"></div>
      </div>
    </div>
  </div>

  <!-- Modals & Toasts (Static for stability) -->
  <div id="modal-detail" class="modal-overlay">...</div>
  <div id="toast"></div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="/static/js/component_loader.js"></script>
  <script>
    async function initSovereign() {
        console.log("[Sovereign] Initializing modular shell...");
        
        const loader = document.getElementById('app-loader');
        
        try {
            await ComponentLoader.loadAll({
                'comp-sidebar': '/static/components/sidebar.html',
                'comp-topbar': '/static/components/topbar.html',
                'comp-stats': '/static/components/stats.html',
                'comp-agi-mood': '/static/components/agi_mood.html',
                'comp-evolution': '/static/components/evolution.html',
                'comp-announcements': '/static/components/announcements.html',
                'page-finance-root': '/static/components/finance.html',
                'page-tasks-root': '/static/components/tasks.html',
                'page-approvals-root': '/static/components/approvals.html',
                'page-repair-root': '/static/components/repair_center.html',
                'page-improvement-root': '/static/components/improvement.html',
                'page-logs-root': '/static/components/logs.html',
                'page-ceo-root': '/static/components/ceo.html',
                'page-monitoring-root': '/static/components/monitoring.html',
                'page-knowledge-root': '/static/components/knowledge.html',
                'page-runbooks-root': '/static/components/runbooks.html',
                'page-debate-root': '/static/components/debate.html',
                'page-codegen-root': '/static/components/codegen.html'
            });

            // Fade out loader
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);

            // Initialize existing JS logic
            if (window.initializeDashboard) window.initializeDashboard();
            console.log("[Sovereign] All modules loaded and initialized.");
        } catch (e) {
            console.error("[Sovereign] Boot failure:", e);
        }
    }

    window.addEventListener('DOMContentLoaded', initSovereign);
  </script>
  <script src="/static/js/sovereign_core_v121.js"></script>
  <script src="/static/js/sovereign_features_v121.js"></script>
</body>
</html>
