apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: sovereign-agi
  description: Sovereign AGI V2 - Autonomous Execution & Orchestration Platform.
  annotations:
    github.com/project-slug: ai_company/sovereign-agi
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: production
  owner: execution-team
  system: sovereign-agents
  dependsOn:
    - resource:postgres-db
    - resource:redis-queue
    - resource:signoz-otel
  providesApis:
    - api:workflow-api
    - api:public-api
    - api:mcp-api
  links:
    - title: Operations Control Plane
      url: http://localhost:3000
      icon: dashboard
      type: admin-dashboard
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: sovereign-agents
  description: Sovereign AGI Agents System
spec:
  owner: execution-team
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: workflow-api
  description: Durable Workflow Control Plane API
spec:
  type: openapi
  lifecycle: production
  owner: execution-team
  definition: $text: ./services/workflow_api/openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mcp-api
  description: Sovereign MCP Tool Specification
spec:
  type: mcp
  lifecycle: production
  owner: execution-team
  definition: |
    Standardized Model Context Protocol interface for AGI orchestration.
    Exposes: list_active_workflows, trigger_workflow, get_system_health.
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: agent-ceo
  description: Central Brain for Sovereign AGI - Strategy and Planning.
spec:
  type: agent
  lifecycle: production
  owner: execution-team
  system: sovereign-agents
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: worker-project-tasks
  description: High-concurrency Execution Layer for Workflow Steps.
spec:
  type: worker
  lifecycle: production
  owner: execution-team
  system: sovereign-agents
  dependsOn:
    - component:sovereign-agi
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mcp-api
  description: Model Context Protocol (MCP) Standardized Tool Interface
spec:
  type: openapi
  lifecycle: production
  owner: execution-team
  system: sovereign-agents
  definition: |
    openapi: 3.0.0
    info:
      title: Sovereign AGI MCP Tool Interface [Standard]
      version: 13.0.4
