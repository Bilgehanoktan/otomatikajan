# Sovereign AGI Emergency Policy — Phase 18 Configuration
# Governs the behavior of the system during P0/P1 incidents.

emergency_modes:
  safety_freeze:
    action: "STALL_ALL_AUTONOMOUS_TASKS"
    requires_operator_unlock: true
    allow_manual_rollbacks: true
    auto_trigger_on: ["CRIT_SYSTEM_FAILURE", "SECURITY_BREACH_DETECTED"]

  quarantine:
    action: "ISOLATE_AFFECTED_PROJECT"
    block_external_connectors: true
    limit_agent_tokens: 50
    auto_trigger_on: ["PROJECT_BUDGET_EXCEEDED", "ANOMALY_RISK_HIGH"]

  read_only:
    action: "DISABLE_WRITES_TO_PRODUCTION_DB"
    allow_logs: true
    bypass_for_operators: true
    auto_trigger_on: ["DB_CORRUPTION_SUSPECTED", "INFRA_INSTABILITY"]

  fallback_reasoning:
    action: "DOWNGRADE_TO_STABLE_MODEL"
    target_model: "gpt-4o-mini" # Or local "llama3-small"
    auto_trigger_on: ["LATENCY_P95_EXCEEDED", "MODEL_TIMEOUT_STREAK"]

# Escalation paths
escalation:
  p0:
    notify: ["SLACK_INCIDENT_WAR_ROOM", "PAGERDUTY_OPERATIONS"]
    action: "LEVEL_C_ISOLATION"
  p1:
    notify: ["SLACK_ALERTS"]
    action: "LEVEL_B_CANARY_ROLLBACK"












