# Sovereign AGI - External Project Agent Integration & Governance Matrix
# Phase 32 Compliance - Managed Integration Gate
# Defines the integration modes, risk profiles, allowed scopes, and safety boundaries for the 15 external repositories.

integration_matrix:
  # 1. OpenHands/OpenHands
  openhands:
    name: "OpenHands"
    repo_url: "https://github.com/All-Hands-AI/OpenHands"
    integration_type: "pattern_only"
    purpose: "Developer agent runtime architecture and workspace sandbox model."
    risk_level: "high"
    allowed_scopes:
      - "sandbox_isolation_pattern"
      - "event_stream_design"
    forbidden_actions:
      - "direct_workspace_write"
      - "unrestricted_command_execution"
      - "direct_git_push"
    governance:
      requires_approval: true
      max_cost_limit_usd: 50.0

  # 2. OpenHands/software-agent-sdk
  openhands_sdk:
    name: "OpenHands Software Agent SDK"
    repo_url: "https://github.com/All-Hands-AI/software-agent-sdk"
    integration_type: "direct_adapter"
    purpose: "Workspace-based coding agent connection interface."
    risk_level: "medium"
    allowed_scopes:
      - "local_workspace_adapter"
      - "agent_event_listener"
    forbidden_actions:
      - "bypass_event_loop"
      - "production_db_modify"
    governance:
      requires_approval: true
      max_cost_limit_usd: 25.0

  # 3. swe-agent/swe-agent
  swe_agent:
    name: "SWE-agent"
    repo_url: "https://github.com/princeton-nlp/SWE-agent"
    integration_type: "pattern_only"
    purpose: "Issue-to-patch cycle design, utilizing agent-computer interfaces (ACI)."
    risk_level: "high"
    allowed_scopes:
      - "aci_command_definition"
      - "patch_tournament_inspiration"
    forbidden_actions:
      - "direct_git_push"
      - "bypass_human_gate"
    governance:
      requires_approval: true
      max_cost_limit_usd: 100.0

  # 4. SWE-agent/mini-swe-agent
  mini_swe_agent:
    name: "Mini SWE-agent"
    repo_url: "https://github.com/princeton-nlp/SWE-agent" # Sub-module or fork
    integration_type: "direct_adapter"
    purpose: "Lightweight task executor for fast code generation."
    risk_level: "medium"
    allowed_scopes:
      - "isolated_run_command"
      - "subtask_generation"
    forbidden_actions:
      - "read_environment_secrets"
      - "write_root_folders"
    governance:
      requires_approval: true
      max_cost_limit_usd: 20.0

  # 5. browserbase/stagehand
  stagehand:
    name: "Stagehand"
    repo_url: "https://github.com/browserbase/stagehand"
    integration_type: "direct_adapter"
    purpose: "UI diagnostics and browser-based telemetry verification (DOM, Console)."
    risk_level: "medium"
    allowed_scopes:
      - "ui_assertion_execution"
      - "dom_extraction_diagnostics"
    forbidden_actions:
      - "production_payment_execution"
      - "sensitive_data_exfiltration"
    governance:
      requires_approval: true
      max_cost_limit_usd: 15.0

  # 6. browserbase/stagehand-python
  stagehand_python:
    name: "Stagehand Python SDK"
    repo_url: "https://github.com/browserbase/stagehand" # Python port
    integration_type: "direct_adapter"
    purpose: "Backend UI validation and assertion engine."
    risk_level: "medium"
    allowed_scopes:
      - "backend_ui_telemetry"
      - "verifier_mesh_integration"
    forbidden_actions:
      - "bypass_audit_gate"
    governance:
      requires_approval: true
      max_cost_limit_usd: 15.0

  # 7. browserbase/mcp-server-browserbase
  mcp_server_browserbase:
    name: "MCP Server Browserbase"
    repo_url: "https://github.com/browserbase/mcp-server-browserbase"
    integration_type: "optional_tool"
    purpose: "Optional browser automation MCP server."
    risk_level: "low"
    allowed_scopes:
      - "read_browser_content"
      - "screenshot_generation"
    forbidden_actions:
      - "production_login_bypass"
    governance:
      requires_approval: false
      max_cost_limit_usd: 10.0

  # 8. The-PR-Agent/pr-agent
  pr_agent:
    name: "PR-Agent"
    repo_url: "https://github.com/Codium-ai/pr-agent"
    integration_type: "direct_adapter"
    purpose: "Pull request description, feedback, review, and auto-commenting gate."
    risk_level: "low"
    allowed_scopes:
      - "pr_review_generation"
      - "pr_description_update"
    forbidden_actions:
      - "auto_merge_pr"
      - "override_failed_tests"
    governance:
      requires_approval: false
      max_cost_limit_usd: 5.0

  # 9. langchain-ai/langgraph
  langgraph:
    name: "LangGraph"
    repo_url: "https://github.com/langchain-ai/langgraph"
    integration_type: "pattern_only"
    purpose: "Durable state-machine workflow orchestrator with human-in-the-loop triggers."
    risk_level: "medium"
    allowed_scopes:
      - "state_graph_definition"
      - "checkpoint_persistence_strategy"
    forbidden_actions:
      - "direct_execution_of_untrusted_graphs"
    governance:
      requires_approval: true
      max_cost_limit_usd: 50.0

  # 10. crewaiinc/crewai
  crewai:
    name: "CrewAI"
    repo_url: "https://github.com/crewaiinc/crewai"
    integration_type: "pattern_only"
    purpose: "Role-based multi-agent collaboration and hierarchical execution loops."
    risk_level: "medium"
    allowed_scopes:
      - "role_based_prompting"
      - "agent_collaboration_patterns"
    forbidden_actions:
      - "unsupervised_agent_delegation"
    governance:
      requires_approval: true
      max_cost_limit_usd: 40.0

  # 11. crewaiinc/crewai-examples
  crewai_examples:
    name: "CrewAI Examples"
    repo_url: "https://github.com/crewaiinc/crewai-examples"
    integration_type: "reference_only"
    purpose: "Referencing standard configurations and agent personas for complex task solving."
    risk_level: "low"
    allowed_scopes:
      - "agent_role_examples"
    forbidden_actions:
      - "import_external_templates_directly"
    governance:
      requires_approval: false
      max_cost_limit_usd: 0.0

  # 12. backstage/software-templates
  backstage_templates:
    name: "Backstage Software Templates"
    repo_url: "https://github.com/backstage/backstage"
    integration_type: "pattern_only"
    purpose: "Declarative project scaffolding and standardized template structure."
    risk_level: "low"
    allowed_scopes:
      - "scaffold_template_definitions"
      - "skeleton_generation_patterns"
    forbidden_actions:
      - "execute_arbitrary_shell_in_scaffold"
    governance:
      requires_approval: true
      max_cost_limit_usd: 10.0

  # 13. microsoft/TaskWeaver
  taskweaver:
    name: "TaskWeaver"
    repo_url: "https://github.com/microsoft/TaskWeaver"
    integration_type: "pattern_only"
    purpose: "Data analytics and mathematical execution pattern using state-based code generation."
    risk_level: "high"
    allowed_scopes:
      - "dynamic_code_runner_pattern"
      - "dataframe_manipulation_isolation"
    forbidden_actions:
      - "unrestricted_data_access"
      - "execute_live_system_commands"
    governance:
      requires_approval: true
      max_cost_limit_usd: 30.0

  # 14. aider-ai/aider
  aider:
    name: "Aider"
    repo_url: "https://github.com/aider-ai/aider"
    integration_type: "optional_tool"
    purpose: "Low-risk local code modifications and interactive file-editing backend tool."
    risk_level: "low"
    allowed_scopes:
      - "interactive_file_edit"
      - "git_diff_generation"
    forbidden_actions:
      - "automatic_remote_git_push"
    governance:
      requires_approval: false
      max_cost_limit_usd: 15.0

  # 15. AntonOsika/gpt-engineer
  gpt_engineer:
    name: "GPT-Engineer"
    repo_url: "https://github.com/AntonOsika/gpt-engineer"
    integration_type: "reference_only"
    purpose: "Prompt-to-skeleton skeleton layout extraction and multi-file setup templates."
    risk_level: "low"
    allowed_scopes:
      - "prompt_layout_mapping"
      - "skeleton_generation_reference"
    forbidden_actions:
      - "execute_untrusted_scaffolds"
    governance:
      requires_approval: false
      max_cost_limit_usd: 0.0
