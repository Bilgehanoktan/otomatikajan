# Release Contract Matrix definition for Sovereign AGI Control Plane
api_routes:
  - surface: "CEO"
    route: "/api/v1/ceo/overview"
    method: "GET"
    owner_module: "services.workflow_api.ceo_router"
    required_auth: true
    blocking: true
  - surface: "CEO"
    route: "/api/v1/ceo/findings"
    method: "GET"
    owner_module: "services.workflow_api.ceo_router"
    required_auth: true
    blocking: true
  - surface: "CEO"
    route: "/api/v1/ceo/findings/{finding_id}/repair-case"
    method: "POST"
    owner_module: "services.workflow_api.ceo_router"
    required_auth: true
    blocking: true
  - surface: "CEO"
    route: "/api/v1/ceo/diagnostics/stagehand"
    method: "POST"
    owner_module: "services.workflow_api.ceo_router"
    required_auth: true
    blocking: true

  - surface: "Repair Lab"
    route: "/api/v1/repair-lab/runs/{run_id}/artifacts"
    method: "GET"
    owner_module: "services.workflow_api.repair_lab_router"
    required_auth: true
    blocking: true
  - surface: "Repair Lab"
    route: "/api/v1/repair-lab/runs/{run_id}/human-gate"
    method: "GET"
    owner_module: "services.workflow_api.repair_lab_router"
    required_auth: true
    blocking: true
  - surface: "Repair Lab"
    route: "/api/v1/repair-lab/runs/{run_id}/human-gate/decision"
    method: "POST"
    owner_module: "services.workflow_api.repair_lab_router"
    required_auth: true
    blocking: true
  - surface: "Repair Lab"
    route: "/api/v1/repair-lab/runs/{run_id}/pr-review"
    method: "GET"
    owner_module: "services.workflow_api.repair_lab_router"
    required_auth: true
    blocking: true
  - surface: "Repair Lab"
    route: "/api/v1/repair-lab/runs/{run_id}/draft-pr"
    method: "GET"
    owner_module: "services.workflow_api.repair_lab_router"
    required_auth: true
    blocking: true
  - surface: "Repair Lab"
    route: "/api/v1/repair-lab/runs/{run_id}/draft-pr/prepare"
    method: "POST"
    owner_module: "services.workflow_api.repair_lab_router"
    required_auth: true
    blocking: true
  - surface: "Repair Lab"
    route: "/api/v1/repair-lab/diagnostics/{diagnostic_id}"
    method: "GET"
    owner_module: "services.workflow_api.repair_lab_router"
    required_auth: true
    blocking: true
  - surface: "Repair Lab"
    route: "/api/v1/repair-lab/runs/{run_id}/memory-score"
    method: "GET"
    owner_module: "services.workflow_api.repair_lab_router"
    required_auth: true
    blocking: true
  - surface: "Repair Lab"
    route: "/api/v1/repair-lab/learning-memory/profiles/{agent_key}/{strategy}"
    method: "GET"
    owner_module: "services.workflow_api.repair_lab_router"
    required_auth: true
    blocking: true
  - surface: "Repair Lab"
    route: "/api/v1/repair-lab/runs/{run_id}/tournament"
    method: "GET"
    owner_module: "services.workflow_api.repair_lab_router"
    required_auth: true
    blocking: true
  - surface: "Repair Lab"
    route: "/api/v1/repair-lab/runs/{run_id}/tournament/recompute"
    method: "POST"
    owner_module: "services.workflow_api.repair_lab_router"
    required_auth: true
    blocking: true

artifact_schemas:
  - artifact_name: "repair_case.json"
    required: true
    blocking: true
  - artifact_name: "taskflow_run.json"
    required: true
    blocking: true
  - artifact_name: "failure_context.json"
    required: true
    blocking: true
  - artifact_name: "localization_report.json"
    required: false
    blocking: false
  - artifact_name: "repair_plan.json"
    required: false
    blocking: false
  - artifact_name: "patch_candidates.json"
    required: true
    blocking: true
  - artifact_name: "candidate_memory_score.json"
    required: false
    blocking: false
  - artifact_name: "sandbox_result.json"
    required: true
    blocking: true
  - artifact_name: "verifier_mesh_result.json"
    required: true
    blocking: true
  - artifact_name: "risk_report.json"
    required: true
    blocking: true
  - artifact_name: "tournament_result.json"
    required: true
    blocking: true
  - artifact_name: "human_gate_decision.json"
    required: true
    blocking: true
  - artifact_name: "pr_review.json"
    required: true
    blocking: true
  - artifact_name: "draft_pr_metadata.json"
    required: true
    blocking: true
  - artifact_name: "learning_memory_update.json"
    required: false
    blocking: false
  - artifact_name: "artifact_manifest.json"
    required: true
    blocking: true
  - artifact_name: "diagnostic_report.json"
    required: false
    blocking: false

frontend_expected_api_calls:
  - route: "/api/v1/ceo/overview"
    method: "GET"
  - route: "/api/v1/ceo/findings"
    method: "GET"
  - route: "/api/v1/repair-lab/runs/{run_id}/artifacts"
    method: "GET"
  - route: "/api/v1/repair-lab/runs/{run_id}/human-gate"
    method: "GET"
  - route: "/api/v1/repair-lab/runs/{run_id}/tournament"
    method: "GET"
  - route: "/api/v1/repair-lab/runs/{run_id}/draft-pr"
    method: "GET"

blocking_rules:
  critical_endpoint_missing: true
  required_artifact_missing: true
  manifest_hash_mismatch: true
  selected_candidate_mismatch: true
  draft_pr_without_pr_review: true
  human_gate_missing_high_risk: true
  frontend_route_missing: true
