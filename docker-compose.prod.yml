services:
  traefik:
    image: traefik:v3.4
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --api.dashboard=true  # Secured with Basic Auth labels
      - --api.insecure=false

      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # HTTP -> HTTPS redirect (automated)
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https

      # Let's Encrypt configuration
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web

      # Enhanced logging for production
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.format=json

      - --ping=true

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/letsencrypt:/letsencrypt

    networks:
      - proxy

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_company
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ai_company"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "
        if [ -z \"$REDIS_PASSWORD\" ]; then
          redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru;
        else
          redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru;
        fi
      "
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$REDIS_PASSWORD\" ]; then redis-cli ping; else redis-cli -a \"$REDIS_PASSWORD\" ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 5

  deerflow-bridge:
    build:
      context: .
      dockerfile: ./deerflow_bridge/Dockerfile
    container_name: deerflow-bridge
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DEER_FLOW_CONFIG_PATH: /opt/deerflow/config.yaml
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./vendor/deer-flow:/opt/deerflow
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    # Port mapping removed for security; only app and worker can reach this via backend network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      target: production-slim
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/ai_company
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DEERFLOW_BRIDGE_URL: http://deerflow-bridge:8010
      PYTHONPATH: /app
      FORWARDED_ALLOW_IPS: "*"  # Crucial for proxy header trust
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      deerflow-bridge:
        condition: service_healthy
    networks:
      - backend
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # Dashboard Router (Secured)
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${APP_DOMAIN}`)
      - traefik.http.routers.traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard.tls=true
      - traefik.http.routers.traefik-dashboard.tls.certresolver=le
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.middlewares=traefik-auth

      # Basic Auth Middleware
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}

      # Router Configuration
      - traefik.http.routers.aiapp.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.aiapp.entrypoints=websecure
      - traefik.http.routers.aiapp.tls=true
      - traefik.http.routers.aiapp.tls.certresolver=le

      # Service Port
      - traefik.http.services.aiapp.loadbalancer.server.port=8000

      # Security & Performance Middlewares
      - traefik.http.middlewares.aiapp-compress.compress=true
      - traefik.http.middlewares.aiapp-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.aiapp-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.aiapp-headers.headers.stsPreload=true
      - traefik.http.middlewares.aiapp-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.aiapp-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.aiapp-headers.headers.frameDeny=true
      - traefik.http.middlewares.aiapp-headers.headers.referrerPolicy=no-referrer
      - traefik.http.routers.aiapp.middlewares=aiapp-compress@docker,aiapp-headers@docker

  worker:
    build:
      context: .
      target: production-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/ai_company
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DEERFLOW_BRIDGE_URL: http://deerflow-bridge:8010
      PYTHONPATH: /app
    command: >
      celery -A tasks.celery_app worker
        --loglevel=info
        --queues=critical,default,background
        --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      deerflow-bridge:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  beat:
    build:
      context: .
      target: production-slim
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/ai_company
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONPATH: /app
    command: >
      celery -A tasks.celery_app beat
        --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

volumes:
  pgdata:
  redis_data:

networks:
  proxy:
    name: proxy
  backend:
    name: ai_company_backend
