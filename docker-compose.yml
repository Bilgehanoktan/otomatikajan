services:
  # ── PostgreSQL (pgvector) ────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_company
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env dosyasinda tanimlanmali}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: [ "127.0.0.1:5433:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "
        if [ -z \"$REDIS_PASSWORD\" ]; then
          redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru;
        else
          redis-server --requirepass \"$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy allkeys-lru;
        fi
      "
    ports: [ "127.0.0.1:6380:6379" ]
    healthcheck:
      test: [ "CMD-SHELL", "if [ -z \"$REDIS_PASSWORD\" ]; then redis-cli ping; else redis-cli -a \"$REDIS_PASSWORD\" ping; fi" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Uygulaması ────────────────────────────────────
  app:
    build:
      context: .
      target: production-slim
    restart: unless-stopped
    env_file:
      - .env
      # - .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/ai_company
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      DEERFLOW_BRIDGE_URL: http://deerflow-bridge:8010
      WORKERS: "2"
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      deerflow-bridge:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.5'
    volumes:
      - .:/app

  # ── Celery Worker ─────────────────────────────────────────
  worker:
    build:
      context: .
      target: production-worker
    restart: unless-stopped
    env_file:
      - .env
      # - .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/ai_company
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      DEERFLOW_BRIDGE_URL: http://deerflow-bridge:8010
      PYTHONPATH: /app
    # Komut Dockerfile'a taşındı, burada override edilebilir
    healthcheck:
      test: [ "CMD-SHELL", "celery -A tasks.celery_app inspect ping || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      deerflow-bridge:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.5'

  # ── DeerFlow Worker (İzole Kuyruk) ─────────────────────────
  deerflow-worker:
    build:
      context: .
      target: production-worker
    restart: unless-stopped
    env_file:
      - .env
      # - .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/ai_company
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      DEERFLOW_BRIDGE_URL: http://deerflow-bridge:8010
      PYTHONPATH: /app
    command: >
      celery -A tasks.celery_app worker
        --queues=deerflow
        --concurrency=2
        --loglevel=info
        --hostname=deerflow-worker@%h
    healthcheck:
      test: [ "CMD-SHELL", "celery -A tasks.celery_app inspect ping -d deerflow-worker@$HOSTNAME || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      deerflow-bridge:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'

  # ── Celery Beat (Zamanlayıcı) ───────────────────────────
  beat:
    build:
      context: .
      target: production-slim
    restart: unless-stopped
    env_file:
      - .env
      # - .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/ai_company
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      PYTHONPATH: /app
    command: >
      celery -A tasks.celery_app beat
        --loglevel=info
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── DeerFlow Bridge ───────────────────────────────────────
  deerflow-bridge:
    build:
      context: .
      dockerfile: ./deerflow_bridge/Dockerfile
    container_name: deerflow-bridge
    restart: unless-stopped
    env_file:
      - .env
      # - .env.local
    environment:
      DEER_FLOW_CONFIG_PATH: /opt/deerflow/config.yaml
      DEER_FLOW_HOME: /app/.deer-flow
      CLAUDE_PROXY_URL: ${CLAUDE_PROXY_URL:-}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8010:8010"
    volumes:
      - ./vendor/deer-flow:/opt/deerflow
      # Sadece Docker sandbox kullanacaksan:
      # - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'


volumes:
  pgdata:

    # ── NOT ──────────────────────────────────────────────────────
    # Local development için port açmak istersen:
