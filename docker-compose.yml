services:
  # Base file:
  # - `docker compose up` starts the minimal local developer topology.
  # - `docker compose --profile full-stack up` adds Redis, Postgres,
  #   workers, DeerFlow, scheduler, and Telegram integrations.

  app:
    build:
      context: .
      target: production-slim
    restart: no
    env_file:
      - .env
    environment:
      RUNTIME_PROFILE: ${RUNTIME_PROFILE:-local-dev}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      CELERY_ENABLED: ${CELERY_ENABLED:-false}
      DEERFLOW_ENABLED: ${DEERFLOW_ENABLED:-false}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      QUEUE_BACKEND: ${QUEUE_BACKEND:-inprocess}
      APP_UI_MODE: ${APP_UI_MODE:-api-only}
      LOCAL_DEV_DB_STRATEGY: ${LOCAL_DEV_DB_STRATEGY:-sqlite-fallback}
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/ai_company
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      DEERFLOW_BRIDGE_URL: http://deerflow-bridge:8010
      WORKERS: "1"
      GUNICORN_TIMEOUT: "120"
      SOVEREIGN_LIGHTWEIGHT_STARTUP: ${SOVEREIGN_LIGHTWEIGHT_STARTUP:-true}
      SOVEREIGN_BACKGROUND_LOOPS_ENABLED: "false"
      INPROCESS_JOB_WORKERS_ENABLED: ${INPROCESS_JOB_WORKERS_ENABLED:-false}
      PRMR_AUDIT_ENABLED: "false"
      PYTHONPATH: /app
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DOCKER_CONTAINER: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "0.5"
    volumes:
      - .:/app
      - runtime_data:/app/runtime/data

  # Control plane frontend (keeps legacy Dockerfile.cms name for now)
  cms:
    build:
      context: .
      dockerfile: Dockerfile.cms
    restart: no
    env_file:
      - .env
    environment:
      RUNTIME_PROFILE: ${RUNTIME_PROFILE:-local-dev}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      CELERY_ENABLED: ${CELERY_ENABLED:-false}
      DEERFLOW_ENABLED: ${DEERFLOW_ENABLED:-false}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      QUEUE_BACKEND: ${QUEUE_BACKEND:-inprocess}
      APP_UI_MODE: ${APP_UI_MODE:-api-only}
      LOCAL_DEV_DB_STRATEGY: ${LOCAL_DEV_DB_STRATEGY:-sqlite-fallback}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/ai_company
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      DOCKER_CONTAINER: "true"
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3100
      NEXT_PUBLIC_API_URL: http://app:8000
      BACKEND_ORIGIN: http://app:8000
    ports:
      - "3100:3100"

  db:
    profiles: ["full-stack"]
    image: pgvector/pgvector:pg16
    restart: no
    environment:
      POSTGRES_DB: ai_company
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env dosyasinda tanimlanmali}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["full-stack"]
    image: redis:7-alpine
    restart: no
    command: >
      sh -c "
        if [ -z \"$REDIS_PASSWORD\" ]; then
          redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru;
        else
          redis-server --requirepass \"$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy allkeys-lru;
        fi
      "
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$REDIS_PASSWORD\" ]; then redis-cli ping; else redis-cli -a \"$REDIS_PASSWORD\" ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    profiles: ["full-stack"]
    build:
      context: .
      target: production-worker
      args:
        INSTALL_DOCKER_CLI: ${INSTALL_DOCKER_CLI:-false}
    restart: no
    env_file:
      - .env
    environment:
      RUNTIME_PROFILE: full-stack-local
      REDIS_ENABLED: "true"
      CELERY_ENABLED: "true"
      DEERFLOW_ENABLED: "true"
      TELEGRAM_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      QUEUE_BACKEND: celery
      APP_UI_MODE: api-only
      LOCAL_DEV_DB_STRATEGY: primary
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/ai_company
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      DEERFLOW_BRIDGE_URL: http://deerflow-bridge:8010
      PYTHONPATH: /app
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DOCKER_CONTAINER: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      deerflow-bridge:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "0.5"
    volumes:
      - .:/app
      - runtime_data:/app/runtime/data

  deerflow-worker:
    profiles: ["full-stack"]
    build:
      context: .
      target: production-worker
      args:
        INSTALL_DOCKER_CLI: ${INSTALL_DOCKER_CLI:-false}
    restart: no
    env_file:
      - .env
    environment:
      RUNTIME_PROFILE: full-stack-local
      REDIS_ENABLED: "true"
      CELERY_ENABLED: "true"
      DEERFLOW_ENABLED: "true"
      TELEGRAM_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      QUEUE_BACKEND: celery
      APP_UI_MODE: api-only
      LOCAL_DEV_DB_STRATEGY: primary
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/ai_company
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      DEERFLOW_BRIDGE_URL: http://deerflow-bridge:8010
      PYTHONPATH: /app
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DOCKER_CONTAINER: "true"
    command: >
      celery -A workers.workflow_worker.tasks.celery_app worker
        --queues=deerflow
        --concurrency=2
        --loglevel=info
        --hostname=deerflow-worker@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.workflow_worker.tasks.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      deerflow-bridge:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
    volumes:
      - .:/app
      - runtime_data:/app/runtime/data

  beat:
    profiles: ["full-stack"]
    build:
      context: .
      target: production-slim
    restart: no
    env_file:
      - .env
    environment:
      RUNTIME_PROFILE: full-stack-local
      REDIS_ENABLED: "true"
      CELERY_ENABLED: "true"
      DEERFLOW_ENABLED: "true"
      TELEGRAM_ENABLED: "false"
      SCHEDULER_ENABLED: "true"
      QUEUE_BACKEND: celery
      APP_UI_MODE: api-only
      LOCAL_DEV_DB_STRATEGY: primary
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/ai_company
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      PYTHONPATH: /app
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DOCKER_CONTAINER: "true"
    command: >
      celery -A workers.workflow_worker.tasks.celery_app beat
        --loglevel=info
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - runtime_data:/app/runtime/data

  deerflow-bridge:
    profiles: ["full-stack"]
    build:
      context: ./libs/vendor/deer-flow
      dockerfile: ./backend/Dockerfile
    container_name: deerflow-bridge
    restart: no
    env_file:
      - .env
    environment:
      GATEWAY_PORT: 8010
      DEER_FLOW_CONFIG_PATH: /opt/deerflow/config.yaml
      DEER_FLOW_HOME: /app/.deer-flow
      CLAUDE_PROXY_URL: ${CLAUDE_PROXY_URL:-}
      PYTHONPATH: /app/backend:/app/backend/packages/harness
      DOCKER_CONTAINER: "true"
    command: ["sh", "-c", "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8010"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8010:8010"
    volumes:
      - ./libs/vendor/deer-flow/backend:/app/backend
      - ./libs/vendor/deer-flow/config.yaml:/opt/deerflow/config.yaml:ro
      - ./libs/vendor/deer-flow/skills:/app/skills:ro
      - ./libs:/app/backend/packages/harness/deerflow/hub_cortex:ro
      - ./services:/app/backend/packages/harness/deerflow/hub_guardian:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"

  telegram-bot:
    profiles: ["full-stack"]
    build:
      context: .
      target: production-slim
    restart: no
    env_file:
      - .env
    environment:
      RUNTIME_PROFILE: full-stack-local
      REDIS_ENABLED: "true"
      CELERY_ENABLED: "true"
      DEERFLOW_ENABLED: "true"
      TELEGRAM_ENABLED: "true"
      SCHEDULER_ENABLED: "false"
      QUEUE_BACKEND: celery
      APP_UI_MODE: api-only
      LOCAL_DEV_DB_STRATEGY: primary
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/ai_company
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      PYTHONPATH: /app
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DOCKER_CONTAINER: "true"
    command: ["python", "-m", "apps.telegram_bot.polling"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - runtime_data:/app/runtime/data

  bilgeapi:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: Dockerfile.bilgeapi
    restart: no
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      BILGEAPI_PORT: "8100"
      # Both are needed: libs/db/session.py reads DATABASE_URL,
      # apps/bilgeapi/config.py reads BILGEAPI_DATABASE_URL.
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/ai_company
      BILGEAPI_DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/ai_company
      BILGEAPI_AUTH_MODE: ${BILGEAPI_AUTH_MODE:-api_key}
      BILGEAPI_STATIC_KEYS: ${BILGEAPI_STATIC_KEYS:-dev-test-key-001:ADMIN}
      BILGEAPI_RATE_LIMIT_RPS: "50"
      PYTHONPATH: /app
      DOCKER_CONTAINER: "true"
    ports:
      - "8100:8100"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8100/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.25"
    volumes:
      - .:/app
      - runtime_data:/app/runtime/data

volumes:
  pgdata:
  runtime_data:
