version: "3.8"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.1.2-alpine
    container_name: signoz-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    restart: no
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  alertmanager:
    image: signoz/alertmanager:0.23.4
    container_name: signoz-alertmanager
    volumes:
      - alertmanager-data:/data
    restart: no
    depends_on:
      - clickhouse

  query-service:
    image: signoz/query-service:0.38.3
    container_name: signoz-query-service
    ports:
      - "8080:8080" # UI/Backend API
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000/?database=signoz_traces
      - ALERTMANAGER_API_URL=http://alertmanager:9093/api/v2/
      - DEPLOYMENT_TYPE=web
    restart: no
    depends_on:
      clickhouse:
        condition: service_healthy

  frontend:
    image: signoz/frontend:0.38.3
    container_name: signoz-frontend
    ports:
      - "3301:3301" # Browser UI
    depends_on:
      - query-service
    restart: no

  otel-collector:
    image: signoz/signoz-otel-collector:0.88.11
    container_name: signoz-otel-collector
    ports:
      - "4317:4317" # OTLP gRPC (This is where our app sends traces)
      - "4318:4318" # OTLP HTTP
    volumes:
      - ../otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz,os.type=linux
    command: ["--config=/etc/otel-collector-config.yaml"]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: no

volumes:
  clickhouse-data:
  alertmanager-data:
