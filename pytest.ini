[pytest]
markers =
    integration: Integration tests for dashboard and API contracts.
    performance: Performance and load tests.
    slow: Tests that take a long time to run.
    docker: Tests that require a running Docker environment.
    e2e: End-to-end user-facing tests.
    smoke: Vital core functionality tests that must pass.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers
asyncio_mode = auto
