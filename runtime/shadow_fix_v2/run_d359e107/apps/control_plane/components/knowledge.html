<div class="card knowledge-base">
    <div class="card-header">
        <span class="card-title"><i class="fas fa-book-open"></i> Bilgi Bankası</span>
        <div class="card-actions">
            <input type="text" id="kb-search" placeholder="Ara..." class="input-sm">
        </div>
    </div>
    
    <div class="kb-content">
        <div class="kb-sidebar">
            <div class="nav-label">Kategoriler</div>
            <div id="kb-tags" class="tag-cloud">
                <!-- Tags will be populated here -->
            </div>
        </div>
        
        <div class="kb-main">
            <div id="kb-articles" class="article-grid">
                <div class="loading">İçerik yükleniyor...</div>
            </div>
        </div>
    </div>
</div>

<style>
    .knowledge-base { height: 100%; display: flex; flex-direction: column; }
    .kb-content { display: flex; gap: 20px; flex: 1; margin-top: 15px; }
    .kb-sidebar { width: 200px; border-right: 1px solid var(--border); padding-right: 15px; }
    .kb-main { flex: 1; overflow-y: auto; }
    .article-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    
    .article-card {
        background: var(--card-bg-alt);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 15px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .article-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }
    .article-title { font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .article-summary { font-size: 13px; color: var(--muted); line-height: 1.4; }
</style>

<script>
    (function() {
        const KB = {
            articles: [],
            
            async init() {
                console.log("[KB] Initializing Knowledge Base...");
                await this.refresh();
                
                document.getElementById('kb-search').addEventListener('input', (e) => {
                    this.render(e.target.value);
                });
            },
            
            async refresh() {
                try {
                    // In a real scenario, this matches the PAYLOAD_BASE_URL
                    const response = await fetch('http://localhost:3100/api/knowledge-articles');
                    const data = await response.json();
                    this.articles = data.docs || [];
                    this.render();
                } catch (e) {
                    console.error("[KB] Fetch error:", e);
                    document.getElementById('kb-articles').innerHTML = `<div class="error">CMS bağlantısı kurulamadı.</div>`;
                }
            },
            
            render(filter = '') {
                const container = document.getElementById('kb-articles');
                const filtered = this.articles.filter(a => 
                    a.title.toLowerCase().includes(filter.toLowerCase()) || 
                    a.summary.toLowerCase().includes(filter.toLowerCase())
                );
                
                if (filtered.length === 0) {
                    container.innerHTML = `<div class="empty">Sonuç bulunamadı.</div>`;
                    return;
                }
                
                container.innerHTML = filtered.map(a => `
                    <div class="article-card" onclick="alert('Detay: ' + '${a.slug}')">
                        <div class="article-title">${a.title}</div>
                        <div class="article-summary">${a.summary}</div>
                    </div>
                `).join('');
                
                // Populating tags
                const tags = [...new Set(this.articles.flatMap(a => (a.tags || []).map(t => t.tag)))];
                document.getElementById('kb-tags').innerHTML = tags.map(t => `
                    <span class="badge" onclick="KB.render('${t}')">${t}</span>
                `).join('');
            }
        };
        
        // Expose to global if needed
        window.KB = KB;
        // Initialize if visible
        KB.init();
    })();
</script>
