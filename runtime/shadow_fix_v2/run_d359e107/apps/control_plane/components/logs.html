<div id="page-logs" class="page">
  <div class="card" style="height:calc(100vh - 180px); display:flex; flex-direction:column; padding:0; overflow:hidden;">
    <div class="card-header" style="padding:16px 24px; border-bottom:1px solid var(--border);">
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="card-title">📟 Canlı Görev Komuta Kayıtları</span>
        <span id="ws-status" style="font-family:var(--mono); font-size:10px; font-weight:800; text-transform:uppercase;">○ Bağlantı Yok</span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('log-feed').innerHTML=''">Temizle</button>
      </div>
    </div>
    <div id="log-feed" style="flex:1;">
      <div class="loading">Sistem çekirdeğine bağlanılıyor…</div>
    </div>
  </div>
</div>
