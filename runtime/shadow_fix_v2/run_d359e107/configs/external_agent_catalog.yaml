# Sovereign AGI - External Agent catalog & Governance
# Phase 32 Compliance - Managed Intake & Governance Gate
# Defines pinned commits, licenses, modes, and safety constraints for external tools.

external_agents:
  swe_agent:
    name: "SWE-agent"
    repo_url: "https://github.com/princeton-nlp/SWE-agent"
    pinned_commit: "a3b2f91c9e8d47562f1c0b39d8e7b6d5c4b3a2f1"
    license: "MIT"
    purpose: "GitHub issue / failure spec -> patch candidate generation using agentic coding loop."
    risk_level: "high"
    allowed_modes:
      - "local_adapter"
      - "reference_only"
    forbidden_actions:
      - "direct_git_push"
      - "production_secrets_read"
      - "bypass_human_gate"

  swe_rex:
    name: "SWE-ReX"
    repo_url: "https://github.com/SWE-ReX/SWE-ReX"
    pinned_commit: "9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b"
    license: "Apache-2.0"
    purpose: "Sandboxed command runtime and code execution environment abstraction."
    risk_level: "medium"
    allowed_modes:
      - "sandbox_runner"
      - "reference_only"
    forbidden_actions:
      - "production_db_modify"
      - "bypass_human_gate"

  pr_agent:
    name: "PR-Agent/Qodo"
    repo_url: "https://github.com/Codium-ai/pr-agent"
    pinned_commit: "1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c"
    license: "Apache-2.0"
    purpose: "Pull request review, automated risk rating, code improvements, and comments generation."
    risk_level: "low"
    allowed_modes:
      - "review_gate"
      - "reference_only"
    forbidden_actions:
      - "direct_git_push"
      - "bypass_human_gate"

  stagehand:
    name: "Stagehand"
    repo_url: "https://github.com/browserbase/stagehand"
    pinned_commit: "f1e2d3c4b5a6f7e8d9c0b1a2f3e4d5c6b7a8f9e0"
    license: "MIT"
    purpose: "UI diagnostics, browser-based telemetry collection (DOM, console, network), and visual assertion verification."
    risk_level: "medium"
    allowed_modes:
      - "local_adapter"
      - "reference_only"
    forbidden_actions:
      - "production_db_modify"
      - "bypass_human_gate"

  openhands:
    name: "OpenHands"
    repo_url: "https://github.com/All-Hands-AI/OpenHands"
    pinned_commit: "e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9"
    license: "MIT"
    purpose: "Heavy developer-agent runtime and workspace workspace interaction skeleton."
    risk_level: "high"
    allowed_modes:
      - "experimental"
      - "reference_only"
    forbidden_actions:
      - "direct_git_push"
      - "production_secrets_read"
      - "production_db_modify"
      - "bypass_human_gate"

  github_copilot:
    name: "GitHub Copilot coding agent"
    repo_url: "https://github.com/features/copilot"
    pinned_commit: "reference_only_non_oss"
    license: "Proprietary"
    purpose: "Architectural reference for issue -> branch/PR -> human review pipeline models."
    risk_level: "low"
    allowed_modes:
      - "reference_only"
    forbidden_actions:
      - "direct_git_push"
      - "production_secrets_read"
      - "production_db_modify"
      - "bypass_human_gate"
