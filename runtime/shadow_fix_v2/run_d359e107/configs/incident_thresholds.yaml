# Sovereign AGI Incident Thresholds — Phase 18
# Maps metrics to severity levels and triggers.

thresholds:
  error_rate_spike:
    metric: "system.error_rate"
    operator: "gt"
    p1: 0.05 # 5% increase -> Canary Rollback
    p0: 0.20 # 20% increase -> Global Safety Freeze
    window_minutes: 5

  latency_degradation:
    metric: "api.latency_p95"
    operator: "gt"
    warn: 1500 # 1.5s -> Model Downgrade
    p1: 5000   # 5s -> Read-only fallback
    window_minutes: 2

  budget_protection:
    metric: "ops.cost_projection_daily"
    operator: "gt"
    p2: 200 # $200 -> Warn/Throttle
    p1: 500 # $500 -> Quarantine affected component
    window_minutes: 15

  health_index:
    metric: "platform.health_score"
    operator: "lt"
    p1: 70 # -> Automatic Audit
    p0: 40 # -> Emergency Reset / Isolation
    window_minutes: 5

  autonomous_failure_streak:
    metric: "agent.self_correction_failures"
    operator: "gt"
    p1: 3 # 3 failed attempts -> Force HITL
    window_minutes: 30

# Monitoring integration (SigNoz/Otel mapping)
telemetry_mapping:
  error_rate: "signoz_metric_v1_error_rate"
  latency: "signoz_metric_v1_latency_p95"
  cost: "custom_billing_projector"
