# Sovereign AGI Region Registry — Phase 20
# Defines geographic regions, their roles, and cluster distribution.

regions:
  - id: us-east-1
    name: "Northern Virginia"
    role: "PRIMARY"
    endpoint: "https://api.us-east.1.sovereign-agi.io"
    active_clusters: ["sec-overwatch-v1", "logic-cortex-v1", "ops-reflex-v1"]
    health_status: "NOMINAL"
    priority: 10

  - id: eu-central-1
    name: "Frankfurt"
    role: "SECONDARY"
    endpoint: "https://api.eu-central.1.sovereign-agi.io"
    active_clusters: ["logic-cortex-v1", "cost-guardian-v1"]
    health_status: "NOMINAL"
    priority: 8

  - id: ap-southeast-1
    name: "Singapore"
    role: "STANDBY"
    endpoint: "https://api.ap-southeast.1.sovereign-agi.io"
    active_clusters: ["logic-cortex-v1"]
    health_status: "NOMINAL"
    priority: 5

global_mesh_settings:
  failover_threshold_ms: 5000
  heartbeat_interval: 30
  max_replication_lag_seconds: 15
  split_brain_protection: "QUORUM" # QUORUM, PRIMARY_ONLY
