workflow_id: self_repair_v1
name: Egemen YAZ Self Repair Workflow
version: 1

trigger:
  type: incident_or_failed_test

steps:
  - id: collect_failure_context
    type: deterministic
    handler: services.repair.repair_orchestrator.collect_failure_context_step
    timeout_seconds: 60
    retry: 1
    artifact: failure_context.json

  - id: build_repair_case
    type: deterministic
    handler: services.repair.repair_orchestrator.build_repair_case_step
    timeout_seconds: 60
    retry: 1
    artifact: repair_case.json

  - id: localize_code
    type: deterministic
    handler: services.repair.repair_orchestrator.localize_code_step
    timeout_seconds: 120
    retry: 1
    artifact: localization_report.json

  - id: create_repair_plan
    type: planning
    handler: services.repair.repair_orchestrator.create_repair_plan_step
    timeout_seconds: 180
    retry: 1
    artifact: repair_plan.json

  - id: generate_patch_candidate
    type: agent
    handler: services.repair.repair_orchestrator.generate_patch_candidate_step
    timeout_seconds: 900
    retry: 2
    requires_sandbox: true
    artifact: patch_candidates.json

  - id: run_sandbox_verification
    type: sandbox
    handler: services.repair.repair_orchestrator.run_sandbox_verification_step
    timeout_seconds: 1200
    retry: 1
    artifact: sandbox_result.json

  - id: run_verifier_mesh
    type: verifier
    handler: services.repair.repair_orchestrator.run_verifier_mesh_step
    timeout_seconds: 600
    retry: 1
    artifact: verifier_mesh_result.json

  - id: run_pr_agent_review
    type: review
    handler: services.repair.repair_orchestrator.run_pr_agent_review_step
    timeout_seconds: 300
    retry: 1
    artifact: pr_review.json

  - id: run_cognitive_integrity_check
    type: verification
    handler: services.repair.repair_orchestrator.run_cognitive_integrity_check_step
    timeout_seconds: 300
    retry: 1
    artifact: cognitive_integrity.json

  - id: score_risk
    type: governance
    handler: services.repair.repair_orchestrator.score_risk_step
    timeout_seconds: 60
    retry: 0
    artifact: risk_report.json

  - id: run_patch_tournament
    type: governance
    handler: services.repair.repair_orchestrator.run_patch_tournament_step
    timeout_seconds: 60
    retry: 0
    artifact: tournament_result.json

  - id: approval_gate
    type: human_gate
    handler: services.taskflow.taskflow_gates.evaluate_gate
    condition: risk_score > 0.30
    artifact: human_gate_decision.json

  - id: prepare_draft_pr
    type: rollout
    handler: services.repair.github_pr_adapter.prepare_draft_pr
    condition: risk_score <= 0.30
    artifact: draft_pr_metadata.json

  - id: update_learning_memory
    type: learning
    handler: services.repair.repair_orchestrator.update_learning_memory_step
    always_run: true
    artifact: learning_memory_update.json
