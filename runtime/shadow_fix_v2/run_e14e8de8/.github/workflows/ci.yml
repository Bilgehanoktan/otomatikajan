name: CI — Test, Lint, Güvenlik

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─────────────────────────────────────────────────────────
  lint:
    name: "Kod Kalitesi (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Ruff kur
        run: pip install "ruff>=0.4.0"

      - name: Linter
        run: ruff check . --output-format=github

      - name: Format kontrolü
        run: ruff format --check .

  # ─────────────────────────────────────────────────────────
  security:
    name: "Güvenlik Taraması (Bandit + pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Güvenlik araçlarını kur
        run: pip install "bandit[toml]>=1.7.8" "pip-audit>=2.7.3"

      - name: Bandit — statik analiz
        run: |
          set +e
          bandit -r apps libs services core infra scripts \
            -x tests,alembic,libs/vendor,.legacy_archive \
            -ll \
            --format json \
            -o bandit-report.json
          status=$?
          set -e
          if [ -f bandit-report.json ]; then
            cat bandit-report.json
          fi
          exit $status

      - name: pip-audit — bağımlılık CVE taraması
        run: |
          set +e
          pip-audit -r requirements.txt --format json --output pip-audit-report.json
          status=$?
          set -e
          if [ -f pip-audit-report.json ]; then
            cat pip-audit-report.json
          fi
          exit $status

      - name: Security raporlarını yükle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  # ─────────────────────────────────────────────────────────
  test:
    name: "Test Suite (pytest)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB:       ai_company_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_company_test
      REDIS_URL:    redis://localhost:6379/0
      JWT_SECRET:   ci-test-secret-min64chars-padding-padding-padding-padding-padding
      ADMIN_SECRET: ci-admin-secret
      ENVIRONMENT:  test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock pytest-cov

      - name: Backend import smoke test
        run: |
          python -c "import apps.public_api.main; print('apps.public_api.main import ok')"
          python -c "import services.workflow_api.main; print('services.workflow_api.main import ok')"

      - name: Backend production import smoke test
        env:
          APP_ENV: production
          ENVIRONMENT: production
          ANTHROPIC_API_KEY: ci-anthropic-key
          WEBHOOK_SECRET: ci-webhook-secret-strong
        run: |
          python -c "import apps.public_api.main; print('apps.public_api.main production import ok')"
          python -c "import services.workflow_api.main; print('services.workflow_api.main production import ok')"

      - name: Testleri çalıştır
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Kapsam raporunu yükle
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────
  ui-test:
    name: "UI E2E Test (Playwright)"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-playwright

      - name: Playwright Tarayıcılarını Kur
        run: playwright install chromium --with-deps

      - name: UI Testlerini Çalıştır (Mocked)
        run: |
          pytest tests/e2e/ -v

  # ─────────────────────────────────────────────────────────
  frontend:
    name: "Frontend Lint & Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace apps/refine_control_plane

      - name: Build frontend
        run: npm run build --workspace apps/refine_control_plane

  # ─────────────────────────────────────────────────────────
  docker:
    name: "Docker Build Doğrulama"
    runs-on: ubuntu-latest
    needs: [lint, test, ui-test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@v3

      - name: Docker imajını derle (push yok)
        uses: docker/build-push-action@v5
        with:
          context:  .
          target:   production-slim
          push:     false
          tags:     ai-yazilim-sirketi:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max
