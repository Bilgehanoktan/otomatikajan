<div id="page-codegen" class="page">
  <div class="card-header" style="margin-bottom:24px; border-bottom:1px solid var(--border); padding-bottom:15px;">
    <span class="card-title">⚡ Otonom Kod Üretim Merkezi (CodeGen V2)</span>
  </div>
  
  <div style="display:grid; grid-template-columns:420px 1fr; gap:20px; align-items:start;">
    <!-- Sol: Form -->
    <div>
      <div class="card" style="margin-bottom:16px;">
        <div class="card-header"><span class="card-title">🚀 Üretim Parametreleri</span></div>
        <div style="padding:4px;">
          <div class="form-row">
            <label>Proje Başlığı</label>
            <input type="text" id="cg-title" placeholder="Örn: E-Ticaret API Servisi">
          </div>
          <div class="form-row">
            <label>Kapsam & Gereksinimler</label>
            <textarea id="cg-desc" rows="4" placeholder="Teknolojiler, özellikler ve kısıtlamaları belirtin..."></textarea>
          </div>
          <div class="form-row">
            <label>Mimari Şablon</label>
            <select id="cg-template" onchange="loadTemplateInfo()">
              <option value="custom">🔧 Özel (Ajanlara Bırak)</option>
              <option value="fastapi_rest">🐍 FastAPI REST API</option>
              <option value="react_spa">⚛️ React SPA (TypeScript)</option>
              <option value="fullstack">🔗 Full-Stack (FastAPI + React)</option>
              <option value="data_pipeline">🗄️ Veri Pipeline (ETL)</option>
              <option value="cli_tool">🖥️ CLI Aracı</option>
            </select>
          </div>
          <div style="margin-top:12px; display:flex; align-items:center; gap:8px;">
             <input type="checkbox" id="cg-review" checked>
             <label for="cg-review" style="font-size:11px; color:var(--text2); cursor:pointer;">Otonom Review (QA) Aktif</label>
          </div>
          <button id="cg-btn" class="btn btn-primary" style="width:100%; height:45px; margin-top:20px;" onclick="startCodeGen()">⚡ Üretimi Başlat</button>
        </div>
      </div>
      
      <div class="card">
        <div class="card-header"><span class="card-title">📋 Şablon Detayları</span></div>
        <div id="cg-template-info" style="font-size:11px; font-family:var(--mono); color:var(--muted); line-height:1.6;">
          Şablon seçin...
        </div>
      </div>
    </div>
    
    <!-- Sağ: Akış ve Sonuç -->
    <div style="display:flex; flex-direction:column; gap:20px;">
       <div id="cg-progress-card" class="card" style="display:none; border-color:var(--accent-glow);">
          <div class="card-header">
            <span class="card-title">🔄 Üretim Sürüyor...</span>
            <span id="cg-progress-agents" style="font-size:10px; font-family:var(--mono); color:var(--accent);"></span>
          </div>
          <div id="cg-progress-log" style="font-family:var(--mono); font-size:11px; max-height:200px; overflow-y:auto; line-height:1.8; color:var(--text2);"></div>
       </div>
       
       <div id="cg-result-card" style="display:none;">
          <div class="card">
            <div class="card-header">
              <span class="card-title">✅ Üretim Tamamlandı</span>
              <button class="btn btn-primary btn-sm" onclick="downloadCodeZip()">⬇ ZIP İndir</button>
            </div>
            <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px;">
               <div style="background:rgba(255,255,255,0.03); border-radius:8px; padding:12px; text-align:center;">
                  <div id="cg-stat-files" style="font-size:18px; font-weight:800; color:var(--accent);">0</div>
                  <div style="font-size:9px; color:var(--muted); margin-top:2px;">Dosya</div>
               </div>
               <div style="background:rgba(255,255,255,0.03); border-radius:8px; padding:12px; text-align:center;">
                  <div class="flex-between" style="border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:12px;">
            <div style="font-weight:bold; color:var(--text1);">Onarım Merkezi & Politika Denetimi</div>
            <div class="status-tag status-active">OTONOM</div>
        </div>
               <div style="background:rgba(255,255,255,0.03); border-radius:8px; padding:12px; text-align:center;">
                  <div id="cg-stat-quality" style="font-size:18px; font-weight:800; color:var(--yellow);">%0</div>
                  <div style="font-size:9px; color:var(--muted); margin-top:2px;">Kalite</div>
               </div>
            </div>
            <div id="cg-file-list" style="max-height:300px; overflow-y:auto;"></div>
          </div>
       </div>
       
       <div class="card">
          <div class="card-header">
            <span class="card-title">📂 Geçmiş Üretimler</span>
            <button class="btn btn-ghost btn-sm" onclick="loadCodeHistory()">↻</button>
          </div>
          <div id="cg-history">
            <div class="loading">Yükleniyor...</div>
          </div>
       </div>
    </div>
  </div>
</div>
