
incident_id: "INC-2024-04-12-01"
module: "libs.workflow.engine"
title: "Durable workflow replay failure after manual cancellation"
description: "Workflow state remains in 'cancelling' indefinitely if the signal is received during a critical replay section."
risk_class: "high"
cost_class: "low"
target_behavior: "Workflow must transition to 'cancelled' within 2 replay cycles."
verification_profile:
  type: "state_transition_check"
  max_wait_ms: 5000
  allowed_final_states: ["cancelled", "failed"]
