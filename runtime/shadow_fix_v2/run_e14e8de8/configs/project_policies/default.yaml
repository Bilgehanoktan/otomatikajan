# Default Project Governance Policy
# All new projects adopt these limits unless overridden.

budget_limit: 10.0           # USD
max_autonomy_level: 2        # L1: Passive, L2: Self-Correction, L3: High Autonomy, L4: Full Sovereign
rate_limit_per_min: 10       # LLM calls per minute
allowed_models:
  - "claude-3-5-sonnet-20240620"
  - "gpt-4o"
  - "deepseek-coder"

secrets:
  # Project-specific overrides for keys can be placed here in project-specific files
  # e.g. DATA_DIR/configs/project_policies/{UUID}.yaml
  placeholder: "none"

audit_retention_days: 30
auto_approve_risk_threshold: 0.1
