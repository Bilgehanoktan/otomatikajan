groups:
  - name: sovereign_operational_alerts
    rules:
      - alert: WorkflowFailed
        expr: workflow_status_count{status="failed"} > 0
        for: 1m
        labels:
          severity: high
          service: workflow_engine
        annotations:
          summary: "Workflow instance failed"
          description: "Workflow {{ $labels.project_id }} has transitioned to FAILED status."

      - alert: BudgetLimitBreached
        expr: workflow_cost_usd_total > 1000
        for: 0m
        labels:
          severity: critical
          service: governance
        annotations:
          summary: "Critical budget limit breached"
          description: "Total platform spend has exceeded the $1000 hard limit."

      - alert: HighRiskAutonomyRequest
        expr: workflow_approval_pending_count{type="autonomy"} > 0
        for: 5m
        labels:
          severity: warning
          service: governance
        annotations:
          summary: "Agent awaiting intervention"
          description: "An agent has requested L4 autonomy for a high-risk tool call."

      - alert: StuckWorkflowDetected
        expr: workflow_heartbeat_last_seconds > 300
        for: 1m
        labels:
          severity: high
          service: worker
        annotations:
          summary: "Workflow heartbeats missing"
          description: "Worker has not reported progress for over 5 minutes."
