workflow_id: project_factory_v1
name: Project Factory Production Workflow
description: Core Project Factory workflow initializing sandbox, requirement gate, and intake.
version: 1
mode: project_factory
writes_code: false
produces_patch: false

trigger:
  type: approved_suggestion

steps:
  - id: create_project_intake
    type: deterministic
    handler: services.project_factory.project_factory_bridge.bridge_suggestion_to_project_factory
    artifact: project_brief.json

  - id: requirement_approval_gate
    type: human_gate
    handler: services.taskflow.taskflow_gates.evaluate_gate
    status: REQUIREMENT_GATE_WAITING
    artifact: requirement_gate.json

  - id: sandbox_implementation_runner
    type: human_gate
    status: IMPLEMENTATION_READY
    artifact: implementation_run.json

  - id: candidate_review_gate
    type: human_gate
    status: HUMAN_GATE_WAITING
    artifact: candidate_review.json

  - id: draft_pr_creation_gate
    type: human_gate
    status: PR_CREATED_WAITING_REVIEW
    artifact: draft_pr_creation.json

  - id: pr_review_gate
    type: human_gate
    status: READY_FOR_FINAL_OPERATOR_DECISION
    artifact: pr_review_report.json

  - id: final_decision_gate
    type: human_gate
    status: PROJECT_CLOSED
    artifact: final_operator_decision.json

  - id: portfolio_intelligence
    type: system_step
    status: INTELLIGENCE_GENERATED
    artifact: portfolio_intelligence.json

  - id: learning_memory_feedback
    type: system_step
    status: LEARNING_FEEDBACK_GENERATED
    artifact: learning_memory_feedback.json

  - id: policy_autopilot
    type: system_step
    status: POLICY_SUGGESTIONS_READY
    artifact: policy_proposals.json

  - id: policy_board_decision
    type: human_gate
    status: POLICY_BOARD_APPROVED_FOR_PREVIEW
    artifact: policy_apply_preview.json

  - id: policy_draft_pr_plan
    type: human_gate
    required_role: governor.override
    metadata:
      gate_type: policy_pr_plan
      description: Operator prepares draft PR plan and governance evidence

  - id: policy_draft_pr_creation
    type: human_gate
    required_role: governor.override
    metadata:
      gate_type: policy_pr_creation
      description: Operator approves and executes the policy draft PR creation safely

  - id: policy_pr_review_gate
    type: human_gate
    required_role: governor.override
    metadata:
      gate_type: policy_pr_review
      description: Operator runs PR review and makes a decision based on scorecard and mesh verification

  - id: policy_final_decision
    type: human_gate
    required_role: governor.override
    metadata:
      gate_type: policy_final_decision
      description: Operator approves final closure, generating the release archive and learning memory sync without applying to production
