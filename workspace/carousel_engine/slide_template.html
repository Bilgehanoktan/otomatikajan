<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Ultra HD Human-Grade Instagram Carousel Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1920px;
      background: #050811;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 70px 60px 60px 60px;
    }

    /* Multi-layered Ambient Glow Orbs */
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(150px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.85;
    }
    .orb-cyan {
      width: 850px;
      height: 850px;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.22) 0%, rgba(0, 0, 0, 0) 70%);
      top: -220px;
      left: -220px;
    }
    .orb-purple {
      width: 950px;
      height: 950px;
      background: radial-gradient(circle, rgba(157, 78, 221, 0.20) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: -250px;
      right: -250px;
    }
    .orb-pink {
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(255, 0, 127, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      top: 550px;
      left: 200px;
    }

    /* Main Glass Card Frame */
    .card-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      background: rgba(13, 19, 33, 0.82);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 40px;
      padding: 56px 52px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 
        0 40px 100px -20px rgba(0, 0, 0, 0.85),
        inset 0 1.5px 0 0 rgba(255, 255, 255, 0.18);
    }

    /* Top Progress Track */
    .header-section {
      width: 100%;
    }
    .progress-bar-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 36px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 40%, #9d4edd 80%, #ff007f 100%);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
    }

    .top-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .badge-pill {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(157, 78, 221, 0.15) 100%);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: #00f2fe;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 10px 24px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
    }
    .slide-counter {
      font-size: 22px;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 1px;
    }
    .slide-counter span {
      color: #00f2fe;
    }

    /* Titles & Headlines */
    .title-headline {
      font-family: 'Outfit', sans-serif;
      font-size: 54px;
      font-weight: 900;
      line-height: 1.15;
      color: #ffffff;
      margin-bottom: 22px;
      letter-spacing: -0.8px;
    }
    .title-headline span.highlight {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #9d4edd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(0, 242, 254, 0.3));
    }

    .divider-line {
      width: 150px;
      height: 6px;
      background: linear-gradient(90deg, #00f2fe, #9d4edd);
      border-radius: 999px;
      margin-bottom: 28px;
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.5);
    }

    .subtitle-text {
      font-size: 27px;
      font-weight: 500;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    /* Main Dynamic Content Area */
    .content-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    /* Highlight Summary Card (Slide 1 Hero) */
    .hero-summary-card {
      background: linear-gradient(135deg, rgba(20, 30, 50, 0.7) 0%, rgba(15, 23, 42, 0.7) 100%);
      border: 1.5px solid rgba(0, 242, 254, 0.3);
      border-radius: 28px;
      padding: 34px 38px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .summary-item {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 26px;
      font-weight: 700;
      color: #f8fafc;
    }
    .summary-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.2) 0%, rgba(157, 78, 221, 0.2) 100%);
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #00f2fe;
    }

    /* Feature Cards (Slide 4/5) */
    .feature-card {
      background: rgba(20, 30, 50, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 30px 34px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .feature-card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 27px;
      font-weight: 800;
      color: #00f2fe;
      margin-bottom: 12px;
    }
    .feature-card-desc {
      font-size: 22px;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* Code Terminal Box Component (Slide 3) */
    .code-container {
      background: #090d16;
      border: 1.5px solid rgba(0, 242, 254, 0.4);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 242, 254, 0.15);
    }
    .code-header {
      background: #111827;
      padding: 18px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .code-dots {
      display: flex;
      gap: 10px;
    }
    .code-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }
    .code-lang {
      font-family: 'JetBrains Mono', monospace;
      font-size: 19px;
      font-weight: 700;
      color: #00f2fe;
    }
    .code-content {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      line-height: 1.65;
      padding: 30px;
      color: #e2e8f0;
      white-space: pre-wrap;
    }
    .code-keyword { color: #ff7b72; font-weight: 700; }
    .code-string { color: #a5d6ff; }
    .code-func { color: #d2a8ff; }
    .code-comment { color: #8b949e; font-style: italic; }

    /* Comparison Table (Slide 2) */
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }
    .comp-box {
      background: rgba(20, 30, 50, 0.6);
      border-radius: 24px;
      padding: 30px;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
    }
    .comp-box.highlight {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.12) 0%, rgba(157, 78, 221, 0.12) 100%);
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
    }
    .comp-title {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .comp-value {
      font-size: 34px;
      font-weight: 900;
      color: #00f2fe;
    }

    /* CTA Box (Slide 6) */
    .cta-container {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.20) 0%, rgba(157, 78, 221, 0.20) 100%);
      border: 2px solid rgba(0, 242, 254, 0.6);
      border-radius: 32px;
      padding: 44px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.25);
    }
    .cta-badge {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #050811;
      font-size: 23px;
      font-weight: 900;
      padding: 10px 28px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
    }
    .cta-text {
      font-size: 36px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.3;
    }
    .cta-sub {
      font-size: 25px;
      color: #cbd5e1;
    }

    /* Footer Section */
    .footer-section {
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-brand {
      font-size: 23px;
      font-weight: 800;
      color: #00f2fe;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .footer-hint {
      font-size: 21px;
      font-weight: 700;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Orbs -->
  <div class="ambient-orb orb-cyan"></div>
  <div class="ambient-orb orb-purple"></div>
  <div class="ambient-orb orb-pink"></div>

  <!-- Main Glass Container -->
  <div class="card-container">
    
    <!-- Header Area -->
    <div class="header-section">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width: {{PROGRESS_PERCENT}}%;"></div>
      </div>
      <div class="top-meta-row">
        <div class="badge-pill">
          <span>{{BADGE_ICON}}</span> {{BADGE_TEXT}}
        </div>
        <div class="slide-counter">SLAYT <span>{{SLIDE_NUM}}</span> / {{TOTAL_SLIDES}}</div>
      </div>

      <h1 class="title-headline">{{TITLE_HTML}}</h1>
      <div class="divider-line"></div>
      {{SUBTITLE_HTML}}
    </div>

    <!-- Main Dynamic Content Area -->
    <div class="content-body">
      {{BODY_HTML}}
    </div>

    <!-- Footer Area -->
    <div class="footer-section">
      <div class="footer-brand">⚡ {{BRAND_HANDLE}}</div>
      <div class="footer-hint">{{FOOTER_HINT}}</div>
    </div>

  </div>

</body>
</html>
